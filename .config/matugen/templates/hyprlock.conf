# hyprlock.conf, generated by matugen (template: hyprlock.conf)
# Mirrors the rofi drun menu: wallpaper on the left, surface-colored panel on
# the right with the clock on top and the password field under it.
# Written for hyprlock 0.9.x (Ubuntu 26.04 ships 0.9.2).
# All sizes/positions use % of the output where it matters, so this works
# on any resolution and scale.
 
general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}
 
# ---------- left half: wallpaper ----------
# Full-screen wallpaper (cover-scaled by hyprlock). The right third gets
# covered by the panel below. Same still image the rofi theme uses.
background {
    monitor =
    path = /home/lau/.cache/rofi_current_wallpaper.png
    color = rgba({{colors.surface.default.hex_stripped}}ff)
    blur_passes = 0
    noise = 0.0
    contrast = 1.0
    brightness = 1.0
    vibrancy = 0.0
}
 
# ---------- right third: panel (rofi right-box = surface) ----------
shape {
    monitor =
    size = 34%, 100%
    color = rgba({{colors.surface.default.hex_stripped}}ff)
    rounding = 0
    border_size = 0
    position = 0, 0
    halign = right
    valign = center
    zindex = 0
}
 
# ---------- accent line between wallpaper and panel (rofi border) ----------
shape {
    monitor =
    size = 3, 100%
    color = rgba({{colors.primary.default.hex_stripped}}d9)
    rounding = 0
    border_size = 0
    position = 16%, 0
    halign = center
    valign = center
    zindex = 1
}
 
# ---------- screen-edge frame, like the 3px rofi window border ----------
# Delete this block if you don't want the border around the screen.
shape {
    monitor =
    size = 100%, 100%
    color = rgba(00000000)
    rounding = 0
    border_size = 3
    border_color = rgba({{colors.primary.default.hex_stripped}}d9)
    position = 0, 0
    halign = center
    valign = center
    zindex = 1
}
 
# ---------- clock (centered in the right third: x = +33% from screen center) ----------
label {
    monitor =
    text = $TIME
    color = rgba({{colors.on_surface.default.hex_stripped}}ff)
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    position = 33%, 90
    halign = center
    valign = center
    zindex = 2
}
 
# Date in the accent color, like the "Apps" prompt in rofi.
label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d. %B"
    color = rgba({{colors.primary.default.hex_stripped}}ff)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 33%, 5
    halign = center
    valign = center
    zindex = 2
}
 
# ---------- password field, styled like the selected rofi row ----------
input-field {
    monitor =
    size = 380, 56
    outline_thickness = 3
    rounding = 5
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba({{colors.primary.default.hex_stripped}}ff)
    inner_color = rgba({{colors.primary.default.hex_stripped}}ff)
    font_color = rgba({{colors.on_primary.default.hex_stripped}}ff)
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = false
    placeholder_text =  Locked
    hide_input = false
    check_color = rgba({{colors.secondary.default.hex_stripped}}ff)
    fail_color = rgba({{colors.error.default.hex_stripped}}ff)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgba({{colors.tertiary.default.hex_stripped}}ff)
    position = 33%, -75
    halign = center
    valign = center
    zindex = 2
}
 
# ---------- weather under the password field ----------
# Runs when hyprlock starts and then every minute. -m 5 stops a dead network
# from hanging the command; the label stays empty until a fetch succeeds
# (e.g. right after wake from suspend, before the network is back).
label {
    monitor =
    text = cmd[update:60000] curl -sf -m 5 "https://wttr.in/Rostock?format=%t+%C&lang=de"
    color = rgba({{colors.on_surface.default.hex_stripped}}ff)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 33%, -150
    halign = center
    valign = center
    zindex = 2
}





# ---------- media player (now playing), under the weather ----------
label {
    monitor =
    text = cmd[update:2000] ~/.config/hypr/scripts/playerctl.sh
    color = rgba(e4e1e9ff)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 33%, -190
    halign = center
    valign = center
    zindex = 2
}
