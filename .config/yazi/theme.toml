[mgr]
cwd = { fg = "#b6d086" }

# Hovered / Selected items
hovered = { fg = "#d2ec9f", bg = "#394d12" }
preview_hovered = { underline = true }

# Selection / Multi-select
find_keyword  = { fg = "#b6d086", bold = true, italic = true }
find_position = { fg = "#c1caab", bold = true }

# Border & Header
border = { fg = "#8f9284" }
title  = { fg = "#b6d086" }

[mode]
normal_main = { fg = "#243600", bg = "#b6d086", bold = true }
normal_alt  = { fg = "#b6d086", bg = "#292b23" }
select_main = { fg = "#2b331d", bg = "#c1caab", bold = true }
select_alt  = { fg = "#c1caab", bg = "#292b23" }

[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#292b23", bg = "#292b23" }

# Permissions
permissions_t = { fg = "#b6d086" }
permissions_r = { fg = "#c1caab" }
permissions_w = { fg = "#ffb4ab" }
permissions_x = { fg = "#a0d0c9" }
permissions_s = { fg = "#8f9284" }

# ==============================================================================
# Dateinamen und Ordner-Text (Streng Weiß)
# ==============================================================================
[filetype]
rules = [
	# Alle Verzeichnisse in Weiß
	{ url = "*/", fg = "#ffffff", bold = true },

	# Executables & Symlinks in Weiß
	{ url = "*", is = "exec", fg = "#ffffff" },
	{ url = "*", is = "link", fg = "#ffffff", italic = true },

	# Fallback: Alle anderen Dateien in Weiß
	{ url = "*", fg = "#ffffff" },
]

# ==============================================================================
# Ordner & Datei-Icons (Matugen Farben gemäß Yazi Spec)
# ==============================================================================
[icon]

# Prepend Dirs: Überschreibt die XDG-Ordner
prepend_dirs = [
	{ name = "Desktop",     text = "󰨇", fg = "#b6d086" },
	{ name = "Development", text = "󰲋", fg = "#b6d086" },
	{ name = "Downloads",   text = "󰉍", fg = "#b6d086" },
	{ name = "Library",     text = "󰂺", fg = "#b6d086" },
	{ name = "Movies",      text = "󰿎", fg = "#b6d086" },
	{ name = "Music",       text = "󱍙", fg = "#b6d086" },
	{ name = "Pictures",    text = "󰋩", fg = "#b6d086" },
	{ name = "Public",      text = "󰋩", fg = "#b6d086" },
	{ name = "Videos",      text = "󰕧", fg = "#b6d086" },
	{ name = "Documents",   text = "󰈙", fg = "#b6d086" },
]

# Prepend Conds: Ordner-Fallback & Spezial-Dateitypen (Executables / Links)
prepend_conds = [
	# Generisches Ordner-Icon für alle restlichen Ordner
	{ if = "dir", text = "󰉋", fg = "#b6d086" },

	# Spezial-Icons
	{ if = "exec", text = "󰅍", fg = "#a0d0c9" },
	{ if = "link", text = "󰌷", fg = "#c1caab" },
]