[mgr]
cwd = { fg = "#ffb595" }

# Hovered / Selected items
hovered = { fg = "#ffdbcc", bg = "#713619" }
preview_hovered = { underline = true }

# Selection / Multi-select
find_keyword  = { fg = "#ffb595", bold = true, italic = true }
find_position = { fg = "#e6bead", bold = true }

# Border & Header
border = { fg = "#a08d85" }
title  = { fg = "#ffb595" }

[mode]
normal_main = { fg = "#542105", bg = "#ffb595", bold = true }
normal_alt  = { fg = "#ffb595", bg = "#322824" }
select_main = { fg = "#442a1f", bg = "#e6bead", bold = true }
select_alt  = { fg = "#e6bead", bg = "#322824" }

[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#322824", bg = "#322824" }

# Permissions
permissions_t = { fg = "#ffb595" }
permissions_r = { fg = "#e6bead" }
permissions_w = { fg = "#ffb4ab" }
permissions_x = { fg = "#d2c78f" }
permissions_s = { fg = "#a08d85" }

# ==============================================================================
# Dateinamen und Ordner-Text (Streng Weiß)
# ==============================================================================
[filetype]
rules = [
	# Alle Verzeichnisse in Weiß
	{ url = "*/", fg = "#ffffff", bold = true },

	# Executables & Symlinks in Weiß
	{ url = "*", is = "exec", fg = "#ffffff" },
	{ url = "*", is = "link", fg = "#ffffff", italic = true },

	# Fallback: Alle anderen Dateien in Weiß
	{ url = "*", fg = "#ffffff" },
]

# ==============================================================================
# Ordner & Datei-Icons (Matugen Farben gemäß Yazi Spec)
# ==============================================================================
[icon]

# Prepend Dirs: Überschreibt die XDG-Ordner
prepend_dirs = [
	{ name = "Desktop",     text = "󰨇", fg = "#ffb595" },
	{ name = "Development", text = "󰲋", fg = "#ffb595" },
	{ name = "Downloads",   text = "󰉍", fg = "#ffb595" },
	{ name = "Library",     text = "󰂺", fg = "#ffb595" },
	{ name = "Movies",      text = "󰿎", fg = "#ffb595" },
	{ name = "Music",       text = "󱍙", fg = "#ffb595" },
	{ name = "Pictures",    text = "󰋩", fg = "#ffb595" },
	{ name = "Public",      text = "󰋩", fg = "#ffb595" },
	{ name = "Videos",      text = "󰕧", fg = "#ffb595" },
	{ name = "Documents",   text = "󰈙", fg = "#ffb595" },
]

# Prepend Conds: Ordner-Fallback & Spezial-Dateitypen (Executables / Links)
prepend_conds = [
	# Generisches Ordner-Icon für alle restlichen Ordner
	{ if = "dir", text = "󰉋", fg = "#ffb595" },

	# Spezial-Icons
	{ if = "exec", text = "󰅍", fg = "#d2c78f" },
	{ if = "link", text = "󰌷", fg = "#e6bead" },
]