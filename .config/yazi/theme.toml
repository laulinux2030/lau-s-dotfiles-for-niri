[mgr]
cwd = { fg = "#82d5c7" }

# Hovered / Selected items
hovered = { fg = "#9ef2e3", bg = "#005048" }
preview_hovered = { underline = true }

# Selection / Multi-select
find_keyword  = { fg = "#82d5c7", bold = true, italic = true }
find_position = { fg = "#b1ccc6", bold = true }

# Border & Header
border = { fg = "#899390" }
title  = { fg = "#82d5c7" }

[mode]
normal_main = { fg = "#003731", bg = "#82d5c7", bold = true }
normal_alt  = { fg = "#82d5c7", bg = "#252b2a" }
select_main = { fg = "#1c3531", bg = "#b1ccc6", bold = true }
select_alt  = { fg = "#b1ccc6", bg = "#252b2a" }

[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#252b2a", bg = "#252b2a" }

# Permissions
permissions_t = { fg = "#82d5c7" }
permissions_r = { fg = "#b1ccc6" }
permissions_w = { fg = "#ffb4ab" }
permissions_x = { fg = "#adcae5" }
permissions_s = { fg = "#899390" }

# ==============================================================================
# Dateinamen und Ordner-Text (Streng Weiß)
# ==============================================================================
[filetype]
rules = [
	# Alle Verzeichnisse in Weiß
	{ url = "*/", fg = "#ffffff", bold = true },

	# Executables & Symlinks in Weiß
	{ url = "*", is = "exec", fg = "#ffffff" },
	{ url = "*", is = "link", fg = "#ffffff", italic = true },

	# Fallback: Alle anderen Dateien in Weiß
	{ url = "*", fg = "#ffffff" },
]

# ==============================================================================
# Ordner & Datei-Icons (Matugen Farben gemäß Yazi Spec)
# ==============================================================================
[icon]

# Prepend Dirs: Überschreibt die XDG-Ordner
prepend_dirs = [
	{ name = "Desktop",     text = "󰨇", fg = "#82d5c7" },
	{ name = "Development", text = "󰲋", fg = "#82d5c7" },
	{ name = "Downloads",   text = "󰉍", fg = "#82d5c7" },
	{ name = "Library",     text = "󰂺", fg = "#82d5c7" },
	{ name = "Movies",      text = "󰿎", fg = "#82d5c7" },
	{ name = "Music",       text = "󱍙", fg = "#82d5c7" },
	{ name = "Pictures",    text = "󰋩", fg = "#82d5c7" },
	{ name = "Public",      text = "󰋩", fg = "#82d5c7" },
	{ name = "Videos",      text = "󰕧", fg = "#82d5c7" },
	{ name = "Documents",   text = "󰈙", fg = "#82d5c7" },
]

# Prepend Conds: Ordner-Fallback & Spezial-Dateitypen (Executables / Links)
prepend_conds = [
	# Generisches Ordner-Icon für alle restlichen Ordner
	{ if = "dir", text = "󰉋", fg = "#82d5c7" },

	# Spezial-Icons
	{ if = "exec", text = "󰅍", fg = "#adcae5" },
	{ if = "link", text = "󰌷", fg = "#b1ccc6" },
]
