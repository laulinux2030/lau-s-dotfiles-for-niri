[mgr]
cwd = { fg = "#ffb3b0" }

# Hovered / Selected items
hovered = { fg = "#ffdad8", bg = "#733332" }
preview_hovered = { underline = true }

# Selection / Multi-select
find_keyword  = { fg = "#ffb3b0", bold = true, italic = true }
find_position = { fg = "#e6bdba", bold = true }

# Border & Header
border = { fg = "#a08c8b" }
title  = { fg = "#ffb3b0" }

[mode]
normal_main = { fg = "#571d1e", bg = "#ffb3b0", bold = true }
normal_alt  = { fg = "#ffb3b0", bg = "#322827" }
select_main = { fg = "#442928", bg = "#e6bdba", bold = true }
select_alt  = { fg = "#e6bdba", bg = "#322827" }

[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#322827", bg = "#322827" }

# Permissions
permissions_t = { fg = "#ffb3b0" }
permissions_r = { fg = "#e6bdba" }
permissions_w = { fg = "#ffb4ab" }
permissions_x = { fg = "#e3c28c" }
permissions_s = { fg = "#a08c8b" }

# ==============================================================================
# Dateinamen und Ordner-Text (Streng Weiß)
# ==============================================================================
[filetype]
rules = [
	# Alle Verzeichnisse in Weiß
	{ url = "*/", fg = "#ffffff", bold = true },

	# Executables & Symlinks in Weiß
	{ url = "*", is = "exec", fg = "#ffffff" },
	{ url = "*", is = "link", fg = "#ffffff", italic = true },

	# Fallback: Alle anderen Dateien in Weiß
	{ url = "*", fg = "#ffffff" },
]

# ==============================================================================
# Ordner & Datei-Icons (Matugen Farben gemäß Yazi Spec)
# ==============================================================================
[icon]

# Prepend Dirs: Überschreibt die XDG-Ordner
prepend_dirs = [
	{ name = "Desktop",     text = "󰨇", fg = "#ffb3b0" },
	{ name = "Development", text = "󰲋", fg = "#ffb3b0" },
	{ name = "Downloads",   text = "󰉍", fg = "#ffb3b0" },
	{ name = "Library",     text = "󰂺", fg = "#ffb3b0" },
	{ name = "Movies",      text = "󰿎", fg = "#ffb3b0" },
	{ name = "Music",       text = "󱍙", fg = "#ffb3b0" },
	{ name = "Pictures",    text = "󰋩", fg = "#ffb3b0" },
	{ name = "Public",      text = "󰋩", fg = "#ffb3b0" },
	{ name = "Videos",      text = "󰕧", fg = "#ffb3b0" },
	{ name = "Documents",   text = "󰈙", fg = "#ffb3b0" },
]

# Prepend Conds: Ordner-Fallback & Spezial-Dateitypen (Executables / Links)
prepend_conds = [
	# Generisches Ordner-Icon für alle restlichen Ordner
	{ if = "dir", text = "󰉋", fg = "#ffb3b0" },

	# Spezial-Icons
	{ if = "exec", text = "󰅍", fg = "#e3c28c" },
	{ if = "link", text = "󰌷", fg = "#e6bdba" },
]
