[mgr]
cwd = { fg = "#80d4d8" }

# Hovered / Selected items
hovered = { fg = "#9cf1f4", bg = "#004f52" }
preview_hovered = { underline = true }

# Selection / Multi-select
find_keyword  = { fg = "#80d4d8", bold = true, italic = true }
find_position = { fg = "#b0cccd", bold = true }

# Border & Header
border = { fg = "#899393" }
title  = { fg = "#80d4d8" }

[mode]
normal_main = { fg = "#003739", bg = "#80d4d8", bold = true }
normal_alt  = { fg = "#80d4d8", bg = "#252b2b" }
select_main = { fg = "#1b3435", bg = "#b0cccd", bold = true }
select_alt  = { fg = "#b0cccd", bg = "#252b2b" }

[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#252b2b", bg = "#252b2b" }

# Permissions
permissions_t = { fg = "#80d4d8" }
permissions_r = { fg = "#b0cccd" }
permissions_w = { fg = "#ffb4ab" }
permissions_x = { fg = "#b5c7e9" }
permissions_s = { fg = "#899393" }

# ==============================================================================
# Dateinamen und Ordner-Text (Streng Weiß)
# ==============================================================================
[filetype]
rules = [
	# Alle Verzeichnisse in Weiß
	{ url = "*/", fg = "#ffffff", bold = true },

	# Executables & Symlinks in Weiß
	{ url = "*", is = "exec", fg = "#ffffff" },
	{ url = "*", is = "link", fg = "#ffffff", italic = true },

	# Fallback: Alle anderen Dateien in Weiß
	{ url = "*", fg = "#ffffff" },
]

# ==============================================================================
# Ordner & Datei-Icons (Matugen Farben gemäß Yazi Spec)
# ==============================================================================
[icon]

# Prepend Dirs: Überschreibt die XDG-Ordner
prepend_dirs = [
	{ name = "Desktop",     text = "󰨇", fg = "#80d4d8" },
	{ name = "Development", text = "󰲋", fg = "#80d4d8" },
	{ name = "Downloads",   text = "󰉍", fg = "#80d4d8" },
	{ name = "Library",     text = "󰂺", fg = "#80d4d8" },
	{ name = "Movies",      text = "󰿎", fg = "#80d4d8" },
	{ name = "Music",       text = "󱍙", fg = "#80d4d8" },
	{ name = "Pictures",    text = "󰋩", fg = "#80d4d8" },
	{ name = "Public",      text = "󰋩", fg = "#80d4d8" },
	{ name = "Videos",      text = "󰕧", fg = "#80d4d8" },
	{ name = "Documents",   text = "󰈙", fg = "#80d4d8" },
]

# Prepend Conds: Ordner-Fallback & Spezial-Dateitypen (Executables / Links)
prepend_conds = [
	# Generisches Ordner-Icon für alle restlichen Ordner
	{ if = "dir", text = "󰉋", fg = "#80d4d8" },

	# Spezial-Icons
	{ if = "exec", text = "󰅍", fg = "#b5c7e9" },
	{ if = "link", text = "󰌷", fg = "#b0cccd" },
]