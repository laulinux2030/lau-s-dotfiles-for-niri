[mgr]
cwd = { fg = "#a4d396" }

# Hovered / Selected items
hovered = { fg = "#bfefb1", bg = "#275021" }
preview_hovered = { underline = true }

# Selection / Multi-select
find_keyword  = { fg = "#a4d396", bold = true, italic = true }
find_position = { fg = "#bbcbb2", bold = true }

# Border & Header
border = { fg = "#8d9387" }
title  = { fg = "#a4d396" }

[mode]
normal_main = { fg = "#10380c", bg = "#a4d396", bold = true }
normal_alt  = { fg = "#a4d396", bg = "#272b25" }
select_main = { fg = "#263422", bg = "#bbcbb2", bold = true }
select_alt  = { fg = "#bbcbb2", bg = "#272b25" }

[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#272b25", bg = "#272b25" }

# Permissions
permissions_t = { fg = "#a4d396" }
permissions_r = { fg = "#bbcbb2" }
permissions_w = { fg = "#ffb4ab" }
permissions_x = { fg = "#a0cfd2" }
permissions_s = { fg = "#8d9387" }

# ==============================================================================
# Dateinamen und Ordner-Text (Streng Weiß)
# ==============================================================================
[filetype]
rules = [
	# Alle Verzeichnisse in Weiß
	{ url = "*/", fg = "#ffffff", bold = true },

	# Executables & Symlinks in Weiß
	{ url = "*", is = "exec", fg = "#ffffff" },
	{ url = "*", is = "link", fg = "#ffffff", italic = true },

	# Fallback: Alle anderen Dateien in Weiß
	{ url = "*", fg = "#ffffff" },
]

# ==============================================================================
# Ordner & Datei-Icons (Matugen Farben gemäß Yazi Spec)
# ==============================================================================
[icon]

# Prepend Dirs: Überschreibt die XDG-Ordner
prepend_dirs = [
	{ name = "Desktop",     text = "󰨇", fg = "#a4d396" },
	{ name = "Development", text = "󰲋", fg = "#a4d396" },
	{ name = "Downloads",   text = "󰉍", fg = "#a4d396" },
	{ name = "Library",     text = "󰂺", fg = "#a4d396" },
	{ name = "Movies",      text = "󰿎", fg = "#a4d396" },
	{ name = "Music",       text = "󱍙", fg = "#a4d396" },
	{ name = "Pictures",    text = "󰋩", fg = "#a4d396" },
	{ name = "Public",      text = "󰋩", fg = "#a4d396" },
	{ name = "Videos",      text = "󰕧", fg = "#a4d396" },
	{ name = "Documents",   text = "󰈙", fg = "#a4d396" },
]

# Prepend Conds: Ordner-Fallback & Spezial-Dateitypen (Executables / Links)
prepend_conds = [
	# Generisches Ordner-Icon für alle restlichen Ordner
	{ if = "dir", text = "󰉋", fg = "#a4d396" },

	# Spezial-Icons
	{ if = "exec", text = "󰅍", fg = "#a0cfd2" },
	{ if = "link", text = "󰌷", fg = "#bbcbb2" },
]