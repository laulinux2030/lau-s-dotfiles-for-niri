[mgr]
cwd = { fg = "#faba72" }

# Hovered / Selected items
hovered = { fg = "#ffddbb", bg = "#673d00" }
preview_hovered = { underline = true }

# Selection / Multi-select
find_keyword  = { fg = "#faba72", bold = true, italic = true }
find_position = { fg = "#e0c1a3", bold = true }

# Border & Header
border = { fg = "#9d8e81" }
title  = { fg = "#faba72" }

[mode]
normal_main = { fg = "#482900", bg = "#faba72", bold = true }
normal_alt  = { fg = "#faba72", bg = "#302921" }
select_main = { fg = "#402d17", bg = "#e0c1a3", bold = true }
select_alt  = { fg = "#e0c1a3", bg = "#302921" }

[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#302921", bg = "#302921" }

# Permissions
permissions_t = { fg = "#faba72" }
permissions_r = { fg = "#e0c1a3" }
permissions_w = { fg = "#ffb4ab" }
permissions_x = { fg = "#bdcd9c" }
permissions_s = { fg = "#9d8e81" }

# ==============================================================================
# Dateinamen und Ordner-Text (Streng Weiß)
# ==============================================================================
[filetype]
rules = [
	# Alle Verzeichnisse in Weiß
	{ url = "*/", fg = "#ffffff", bold = true },

	# Executables & Symlinks in Weiß
	{ url = "*", is = "exec", fg = "#ffffff" },
	{ url = "*", is = "link", fg = "#ffffff", italic = true },

	# Fallback: Alle anderen Dateien in Weiß
	{ url = "*", fg = "#ffffff" },
]

# ==============================================================================
# Ordner & Datei-Icons (Matugen Farben gemäß Yazi Spec)
# ==============================================================================
[icon]

# Prepend Dirs: Überschreibt die XDG-Ordner
prepend_dirs = [
	{ name = "Desktop",     text = "󰨇", fg = "#faba72" },
	{ name = "Development", text = "󰲋", fg = "#faba72" },
	{ name = "Downloads",   text = "󰉍", fg = "#faba72" },
	{ name = "Library",     text = "󰂺", fg = "#faba72" },
	{ name = "Movies",      text = "󰿎", fg = "#faba72" },
	{ name = "Music",       text = "󱍙", fg = "#faba72" },
	{ name = "Pictures",    text = "󰋩", fg = "#faba72" },
	{ name = "Public",      text = "󰋩", fg = "#faba72" },
	{ name = "Videos",      text = "󰕧", fg = "#faba72" },
	{ name = "Documents",   text = "󰈙", fg = "#faba72" },
]

# Prepend Conds: Ordner-Fallback & Spezial-Dateitypen (Executables / Links)
prepend_conds = [
	# Generisches Ordner-Icon für alle restlichen Ordner
	{ if = "dir", text = "󰉋", fg = "#faba72" },

	# Spezial-Icons
	{ if = "exec", text = "󰅍", fg = "#bdcd9c" },
	{ if = "link", text = "󰌷", fg = "#e0c1a3" },
]
